name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Classic branch-push deploy, not the Actions `deploy-pages`/environments
# flow: this repo's `github-pages` environment only allow-lists the
# `gh-pages` branch, and repointing that (or granting admin to add `main`
# to it) needs repo-admin rights neither of us currently has. A plain push
# to `gh-pages` needs nothing beyond the workflow's own `contents: write`
# token, so it sidesteps the environment-protection gate entirely. Revisit
# once someone with admin can either widen that allow-list or move Pages
# onto a workflow-based source — see PR #1's failed run for the error.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          VITE_SPECKLE_APP_ID: ${{ secrets.SPECKLE_APP_ID }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
